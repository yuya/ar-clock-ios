name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_ref:
        description: 取り込む ar-clock の版（ブランチ・タグ・コミット）
        default: main
  repository_dispatch:
    types: [web-updated]      # ar-clock 側の更新を合図にビルドする（設定は README）
  schedule:
    - cron: "17 18 * * *"     # 合図がなくても1日1回、最新の Web で作り直す

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Web アプリを取り込む
        run: scripts/sync-web.sh "${{ github.event.inputs.web_ref || github.event.client_payload.ref || 'main' }}"
      - name: Xcode プロジェクトを生成
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: シミュレータ向けにビルド
        run: |
          set -o pipefail
          xcodebuild -project ARClock.xcodeproj -scheme ARClock -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: できたアプリをまとめる
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ls -la ARClock.app ARClock.app/Web
          zip -qr "$GITHUB_WORKSPACE/ARClock-simulator.zip" ARClock.app
      - uses: actions/upload-artifact@v4
        with:
          name: ARClock-simulator
          path: ARClock-simulator.zip
      - name: シミュレータで起動して画面を撮る
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')]; print(c[0]['udid'])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/ARClock.app
          mkdir -p shots
          xcrun simctl launch "$UDID" com.yuya.arclock
          sleep 10; xcrun simctl io "$UDID" screenshot shots/01-start.png
          xcrun simctl terminate "$UDID" com.yuya.arclock
          xcrun simctl launch "$UDID" com.yuya.arclock -autostart
          sleep 9; xcrun simctl io "$UDID" screenshot shots/02-running-a.png
          sleep 4; xcrun simctl io "$UDID" screenshot shots/03-running-b.png
          sleep 4; xcrun simctl io "$UDID" screenshot shots/04-running-c.png
          xcrun simctl terminate "$UDID" com.yuya.arclock
          xcrun simctl launch "$UDID" com.yuya.arclock -autostart -openSettings
          sleep 13; xcrun simctl io "$UDID" screenshot shots/05-settings.png
          for f in shots/*.png; do sips -Z 1000 "$f" >/dev/null; done
      - name: 撮った画面を ci-shots ブランチに置く
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q -b ci-shots && git add . \
            && git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "screens for ${GITHUB_SHA::7}" \
            && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-shots

  shaders:
    # Web のシェーダを Metal に機械変換し、コンパイルが通るかまで確かめる（段階3の下ごしらえ）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Web アプリを取り込む
        run: scripts/sync-web.sh "${{ github.event.inputs.web_ref || github.event.client_payload.ref || 'main' }}"
      - name: 変換の道具を入れる
        run: brew install glslang spirv-cross
      - name: GLSL → Metal
        run: python3 scripts/translate-shaders.py Generated/Shaders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-shaders
          path: Generated/Shaders
      - name: 変換結果を ci-shaders ブランチに置く
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d Generated/Shaders ] || exit 0
          cd Generated/Shaders && git init -q -b ci-shaders && git add . \
            && git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "shaders for ${GITHUB_SHA::7}" \
            && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-shaders
